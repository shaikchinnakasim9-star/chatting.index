services:
  - type: web
    name: gather-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: gather-869c5
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: gather-client
          property: host

  - type: web
    name: gather-client
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_API_URL
        fromService:
          type: web
          name: gather-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
